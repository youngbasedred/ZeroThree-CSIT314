name: PHP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------
  # CI: Build & Test
  # -------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Install Composer dependencies only if composer.json exists
      - name: Install dependencies (if composer.json exists)
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --no-progress
          else
            echo "No composer.json found. Skipping composer install."
          fi

      # Basic syntax check for all PHP files (excluding vendor)
      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | \
            xargs -0 -n 1 php -l

      # Only run PHPUnit if it exists
      - name: Run PHPUnit tests (if available)
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "PHPUnit not installed. Skipping tests."
          fi

  # -------------------
  # CD: Deploy to "deploy" branch
  # -------------------
  deploy:
    needs: test                    # Only run if test job passes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # Needed so we can create/update branches

      # Optional: add a small deployment info file (helps for screenshots)
      - name: Add deployment info file
        run: |
          echo "Deployed from commit $GITHUB_SHA on $(date -u)" > deployment-info.txt

      # Publish current repo content to "deploy" branch
      - name: Publish to deploy branch
        uses: s0/git-publish-subdir-action@v2.5.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: deploy           # target branch name
          folder: .                # what folder to publish (root of repo)
